<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Controle de Hortaliças</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main>

        <section class="card login-card">

            <h1>🌱 Criar conta</h1>

            <p>
                Cadastre-se para começar a controlar suas perdas.
            </p>

            <form method="POST">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Criar conta
                </button>

            </form>

            <p>
                Já possui uma conta?
                <a href="/login">
                    Entrar
                </a>
            </p>

            <p>
                <a href="/">
                    ← Voltar
                </a>
            </p>

        </section>

    </main>

</body>

</html>
