<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Perdas</title>
</head>

<body>

    <h1>Registro de Perdas</h1>

    <p>Registre as perdas ocorridas na produção.</p>

    <form>
        <label for="produto">Produto:</label>
        <input type="text" id="produto" name="produto" required>

        <br><br>

        <label for="quantidade">Quantidade perdida:</label>
        <input type="number" id="quantidade" name="quantidade" min="1" required>

        <br><br>

        <label for="data">Data da perda:</label>
        <input type="date" id="data" name="data" required>

        <br><br>

        <label for="motivo">Motivo da perda:</label>
<input type="text" id="motivo" name="motivo" required>
        <br><br>

        <button type="submit">Registrar perda</button>
    </form>

</body>
</html>
